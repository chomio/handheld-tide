<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#061632" />
    <meta name="description" content="손끝에 반응해 유영하는 비단잉어의 디지털 연못" />
    <title>기억하는 연못 — A Pool That Remembers</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="artwork" aria-labelledby="piece-title">
      <canvas id="water" aria-label="손끝과 움직임에 반응하는 디지털 연못"></canvas>
      <div class="paper" aria-hidden="true"></div>
      <div class="shade" aria-hidden="true"></div>

      <header class="topline">
        <p class="index">OBJECT / 02</p>
        <p class="collection">A STUDY IN ATTENTION</p>
        <button id="quiet-button" class="quiet-button" type="button" aria-label="작품을 고요한 상태로 되돌리기">고요로</button>
      </header>

      <section class="title-block" aria-label="작품 제목">
        <p class="kicker">A SMALL INTERACTIVE POND</p>
        <h1 id="piece-title"><span>기억하는</span><span>연못</span></h1>
        <p class="english-title">A Pool That Remembers</p>
      </section>

      <section class="fish-stage" aria-hidden="true">
        <div class="halo halo-one"></div>
        <div class="halo halo-two"></div>
        <div id="fish-shadow" class="fish-shadow"></div>
        <div id="fish" class="fish">
          <img src="assets/celestial-carp.png" alt="" />
          <span class="fish-glint"></span>
        </div>
      </section>

      <aside class="annotation">
        <span class="annotation-line" aria-hidden="true"></span>
        <p>당신이 남긴 파문은<br />다음 움직임의 물살이 됩니다.</p>
      </aside>

      <footer class="bottomline">
        <p id="state-label" aria-live="polite">WATER / RESTING</p>
        <p>TOUCH · MOVE · TILT</p>
        <p id="counter">00:00</p>
      </footer>

      <section id="welcome" class="welcome" aria-label="작품 시작">
        <div class="welcome-inner">
          <p class="welcome-mark">水</p>
          <p class="welcome-copy">화면 위에 손을 올려<br />물에게 한 번 말을 걸어 보세요.</p>
          <button id="enter-button" class="enter-button" type="button">연못에 닿기 <span aria-hidden="true">↗</span></button>
          <p class="welcome-note">휴대폰에서는 기기를 기울여 보세요.</p>
        </div>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
